# Weekly encrypted backup of the lite-mode database (Neon/Supabase), for hosts with no `backup` service.
# Setup: docs/BACKUP.md. Secrets needed: DATABASE_URL and BACKUP_PASSPHRASE (>= 24 random characters).
name: backup

on:
  schedule:
    - cron: "17 3 * * 0" # Sundays 03:17 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          [ -n "$DATABASE_URL" ] || { echo "::error::Secret DATABASE_URL is missing"; exit 1; }
          [ "${#BACKUP_PASSPHRASE}" -ge 24 ] || { echo "::error::Secret BACKUP_PASSPHRASE must be at least 24 characters"; exit 1; }

      # The WhatsApp login (wa_auth_state) is left out on purpose: the dump may sit in a public repo's
      # artifacts, and a restored bot simply shows a fresh QR to link again.
      - name: Dump (Postgres 17 client) and encrypt
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -eu
          docker run --rm postgres:17 pg_dump --no-owner --clean --if-exists \
            --exclude-table-data=wa_auth_state "$DATABASE_URL" | gzip > db.sql.gz
          gzip -t db.sql.gz
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:BACKUP_PASSPHRASE -in db.sql.gz -out "db-$(date -u +%Y%m%dT%H%M%SZ).sql.gz.enc"
          rm db.sql.gz
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: db-backup
          path: db-*.sql.gz.enc
          retention-days: 30
          if-no-files-found: error
